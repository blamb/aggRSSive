{% extends "base.html" %}
{% block title %}{{ page.title }} · Help · aggRSSive{% endblock %}
{% block content %}
<div class="help">
<nav class="help-nav">
  <h3>Help</h3>
  <ul class="plain">
  {% for p in pages %}<li{% if p.slug == page.slug %} class="current"{% endif %}><a href="/help/{{ p.slug }}">{{ p.title }}</a></li>{% endfor %}
  </ul>
</nav>
<article class="prose">
{{ page.html|safe_html }}
</article>
</div>
{% endblock %}
