<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>aggRSSive registered</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:2rem;color:#1d1d1f;background:#fbfaf7}.box{max-width:560px;background:#fff;border:1px solid #e4e1da;border-radius:8px;padding:1.2rem 1.5rem}h1{font-size:1.2rem;margin:0 0 .5rem}.ok{color:#2a7}button{font:inherit;padding:.5rem 1rem;border-radius:6px;border:0;background:#c8102e;color:#fff;cursor:pointer}</style></head>
<body><div class="box">
<h1><span class="ok">✓</span> aggRSSive is registered with {{ platform.name }}</h1>
<p>You can close this window. In Moodle, the tool now appears under <em>External tool</em>; activate it if it shows as pending, then add an aggRSSive to any course with <em>Add an activity → External tool → aggRSSive → Select content</em>.</p>
<p><button onclick="closeMe()">Close</button></p>
</div>
<script>
function closeMe(){ (window.opener || window.parent).postMessage({subject:"org.imsglobal.lti.close"}, "*"); }
closeMe();
</script>
</body></html>
