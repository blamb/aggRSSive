# Build the container image on every push to main and publish it to
# ghcr.io/blamb/aggrssive. Reclaim Cloud (and anyone else) pulls from there.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blamb/aggrssive:latest
            ghcr.io/blamb/aggrssive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
