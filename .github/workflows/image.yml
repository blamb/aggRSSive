# Build the container image on every push to main and publish it to
# ghcr.io/blamb/aggrssive. Reclaim Cloud (and anyone else) pulls from there.
name: Build image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once locally and prove the image actually starts before anything is published.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aggrssive:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 8000:8000 -e SECRET_KEY=smoke aggrssive:smoke
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null && curl -sf http://localhost:8000/classification > /dev/null; then echo "image boots"; exit 0; fi
            sleep 2
          done
          echo "image failed to start"; docker logs smoke; exit 1

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/blamb/aggrssive:latest
            ghcr.io/blamb/aggrssive:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
