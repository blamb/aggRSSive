[project]
name = "aggrssive"
version = "2.0.0a1"
description = "Collect, tag, filter and remix feeds into republishable bundles. A second edition of the 2005 original."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "feedparser>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "bcrypt>=4.0",
    "itsdangerous>=2.2",
    "authlib>=1.3",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.0",
    "nh3>=0.2",
    "PyJWT[crypto]>=2.8",
    "anthropic>=1.0",
    "markdown>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aggrssive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
aggrssive = ["data/*.txt", "templates/*.html", "static/*", "docs/*.md", "collections/*.opml"]
